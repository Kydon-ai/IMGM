<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:; connect-src 'self' https:; font-src 'self' data:;" />
    <title>图片检索工具</title>
    <style>
        /* 工具栏样式 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .toolbar-btn.primary {
            background-color: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .toolbar-btn.primary:hover {
            background-color: #3367d6;
        }

        .icon {
            margin-right: 6px;
            font-size: 15px;
        }

        .path-controls {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .path-controls button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }

        .path-controls button:last-child {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            padding: 8px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
        }

        #search-input,#rir-search-input,#rir-parse-input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            width: 200px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-left: none;
            border-radius: 0 6px 6px 0;
            background-color: #f8f8f8;
            cursor: pointer;
        }

        .search-btn:hover {
            background-color: #eee;
        }

        #file-path {
        }
		.url-style {
            font-weight: bold;
            color: #4285f4;
            margin-left: 5px;
		}

        /* 图片展示区域 - 修复高度问题 */
        .image-container {
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .grid-img {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 确保4列 */
            grid-auto-rows: 1fr; /* 所有行等高 */
            gap: 15px;
            /* padding: 10px 0; */
        }

        .img-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            aspect-ratio: 1/1; /* 保持正方形 */
            background-color: #f8f8f8;
            display: flex; /* 新增 */
            flex-direction: column; /* 新增 */
			border: 1px solid #ddd; /* 新增 - 边框 */
        }

        .img-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            flex-grow: 1; /* 新增 - 确保图片填充空间 */
        }

        /* 操作按钮 */
        .copy-btn, .rename-btn {
            position: absolute;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.9);
            color: #333;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }

        .copy-btn {
            top: 8px;
            right: 8px;
        }

        .rename-btn {
            top: 8px;
            left: 8px;
        }

        .img-item:hover .copy-btn,
        .img-item:hover .rename-btn {
            opacity: 1;
        }

        .copy-btn:hover, .rename-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .pagination-info {
            font-size: 14px;
            color: #555;
        }

        body {
            margin: 0;
            min-width: 1220px;
            min-height: 100vh;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            color: #1f2937;
            background: #eef3f8;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 14px;
            padding: 10px;
        }

        /* imgm 风格的窄侧栏：保持固定宽度，让主工作区拥有更多空间。 */
        .imgm-sidebar {
            position: relative;
            z-index: 10;
            display: flex;
            flex: 0 0 72px;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 20px);
            box-sizing: border-box;
            padding: 15px 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 17px;
            background: linear-gradient(180deg, #176bd1 0%, #2451b8 55%, #332f93 100%);
            box-shadow: 0 12px 30px rgba(29, 73, 146, 0.22);
            color: #fff;
        }

        .imgm-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            width: 100%;
        }

        .imgm-avatar {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 3px;
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 14px rgba(10, 44, 115, 0.24);
        }

        .imgm-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .imgm-profile-name {
            max-width: 58px;
            overflow: hidden;
            color: rgba(255, 255, 255, 0.92);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .imgm-nav {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            /* margin-top: 22px; */
        }

        .imgm-nav-item,
        .imgm-settings-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 54px;
            min-height: 58px;
            padding: 6px 3px;
            border: 0;
            border-radius: 13px;
            color: rgba(255, 255, 255, 0.76);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .imgm-nav-item:hover,
        .imgm-settings-button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .imgm-nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.19);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 6px 14px rgba(12, 43, 111, 0.16);
        }

        .imgm-nav-icon {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            margin-bottom: 4px;
            border-radius: 10px;
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            font-size: 18px;
            line-height: 1;
        }

        .imgm-nav-label {
            font-size: 11px;
            line-height: 1;
            white-space: nowrap;
        }

        .imgm-sidebar-divider {
            width: 42px;
            height: 1px;
            margin: 8px 0 10px;
            background: rgba(255, 255, 255, 0.18);
        }

        .imgm-settings-button {
            min-height: 54px;
        }

        .settings-popover {
            position: absolute;
            bottom: 12px;
            left: 84px;
            width: 238px;
            padding: 14px;
            border: 1px solid #dce5f5;
            border-radius: 13px;
            color: #25324a;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 14px 35px rgba(28, 47, 85, 0.2);
        }

        .settings-popover[hidden] {
            display: none;
        }

        .settings-popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .settings-close {
            width: 25px;
            height: 25px;
            border: 0;
            border-radius: 7px;
            color: #63708b;
            background: #f0f4fa;
            cursor: pointer;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-top: 1px solid #edf1f7;
            font-size: 12px;
        }

        .settings-row strong {
            max-width: 145px;
            overflow: hidden;
            color: #4b6dcc;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .settings-toggle-copy {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 3px;
        }

        .settings-toggle-title {
            color: #25324a;
            font-weight: 600;
        }

        .settings-toggle-description {
            color: #8590a6;
            font-size: 10px;
        }

        .settings-switch {
            position: relative;
            display: inline-flex;
            flex: 0 0 auto;
            width: 38px;
            height: 22px;
            cursor: pointer;
        }

        .settings-switch input {
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .settings-switch-track {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #cbd4e4;
            transition: background 0.2s ease;
        }

        .settings-switch-track::after {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(31, 47, 78, 0.25);
            content: "";
            transition: transform 0.2s ease;
        }

        .settings-switch input:checked + .settings-switch-track {
            background: #4b6dcc;
        }

        .settings-switch input:checked + .settings-switch-track::after {
            transform: translateX(16px);
        }

        .settings-switch input:focus-visible + .settings-switch-track {
            outline: 2px solid #91aaf2;
            outline-offset: 2px;
        }

        .settings-note {
            margin: 10px 0 0;
            color: #8590a6;
            font-size: 11px;
            line-height: 1.5;
        }

        .app-layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(750px, 1fr) 350px;
            gap: 14px;
            align-items: start;
            min-width: 0;
        }

        .browser-section {
            scroll-margin-top: 18px;
        }

        .browser-section[data-page-section] {
            display: none;
        }

        .browser-section[data-page-section].active {
            display: block;
        }

        .app-shell.rir-mode .ai-panel {
            display: none;
        }

        .app-shell.rir-mode .app-layout {
            grid-template-columns: minmax(750px, 1fr);
        }

        .image-browser {
            min-width: 750px;
        }

        .ai-panel {
            position: sticky;
            top: 10px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 20px);
            min-height: 620px;
            overflow: hidden;
            border: 1px solid #dde3ec;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(36, 55, 88, 0.12);
        }

        .ai-panel-header {
            padding: 14px 16px 12px;
            color: #fff;
            background: linear-gradient(135deg, #245eea, #7048e8);
        }

        .ai-panel-header h2 {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .ai-status {
            min-height: 18px;
            margin: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.84);
        }

        .ai-messages {
            flex: 1;
            min-height: 140px;
            overflow-y: auto;
            padding: 14px;
            background: #f7f8fc;
        }

        .ai-message {
            width: fit-content;
            max-width: 88%;
            margin-bottom: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-message.assistant {
            border: 1px solid #e2e6ee;
            border-bottom-left-radius: 3px;
            background: #fff;
        }

        .ai-message.user {
            margin-left: auto;
            border-bottom-right-radius: 3px;
            color: #fff;
            background: #3569df;
        }

        .ai-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 14px 10px;
            background: #f7f8fc;
        }

        .ai-suggestion {
            padding: 5px 8px;
            border: 1px solid #ccd7f7;
            border-radius: 999px;
            color: #3159b8;
            background: #eef3ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-results-section {
            max-height: 245px;
            overflow-y: auto;
            padding: 10px 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-results-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #687187;
        }

        .ai-results {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ai-result-card {
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid #e0e5ee;
            border-radius: 7px;
            background: #fff;
            cursor: pointer;
        }

        .ai-result-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .ai-result-card span {
            display: block;
            padding: 4px;
            overflow: hidden;
            font-size: 9px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ai-show-gallery {
            padding: 3px 7px;
            border: 1px solid #c7d4f9;
            border-radius: 5px;
            color: #3159b8;
            background: #f2f5ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-composer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-composer textarea {
            min-height: 44px;
            max-height: 110px;
            padding: 8px 9px;
            resize: vertical;
            border: 1px solid #ccd2dd;
            border-radius: 7px;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        .ai-composer textarea:focus {
            border-color: #4773df;
            box-shadow: 0 0 0 2px rgba(71, 115, 223, 0.13);
        }

        .ai-send {
            align-self: end;
            height: 38px;
            padding: 0 13px;
            border: none;
            border-radius: 7px;
            color: #fff;
            background: #3569df;
            cursor: pointer;
        }

        .ai-send:disabled {
            opacity: 0.55;
            cursor: wait;
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="node_modules/notyf/notyf.min.css">

    <div id="app-shell" class="app-shell">
    <aside class="imgm-sidebar" aria-label="主导航">
        <nav class="imgm-nav" aria-label="功能导航">
            <button class="imgm-nav-item active" type="button" data-target="local-section" aria-controls="local-section" aria-current="page">
                <span class="imgm-nav-icon" aria-hidden="true">▦</span>
                <span class="imgm-nav-label">图片库</span>
            </button>
            <button class="imgm-nav-item" type="button" data-target="rir-section" aria-controls="rir-section">
                <span class="imgm-nav-icon" aria-hidden="true">↗</span>
                <span class="imgm-nav-label">远程 RIR</span>
            </button>
            <button class="imgm-nav-item" type="button" data-target="ai-panel" aria-controls="ai-panel">
                <span class="imgm-nav-icon" aria-hidden="true">✦</span>
                <span class="imgm-nav-label">AI 助手</span>
            </button>
        </nav>
        <div class="imgm-sidebar-divider"></div>
        <button id="settings-button" class="imgm-settings-button" type="button" aria-expanded="false" aria-controls="settings-popover">
            <span class="imgm-nav-icon" aria-hidden="true">⚙</span>
            <span class="imgm-nav-label">设置</span>
        </button>
        <div id="settings-popover" class="settings-popover" hidden>
            <div class="settings-popover-header">
                <span>设置</span>
                <button id="settings-close" class="settings-close" type="button" aria-label="关闭设置">×</button>
            </div>
            <div class="settings-row">
                <span>当前图片目录</span>
                <strong id="settings-path">未选择</strong>
            </div>
            <div class="settings-row">
                <div class="settings-toggle-copy">
                    <span class="settings-toggle-title">终端日志转发</span>
                    <span class="settings-toggle-description">复制渲染进程的 console 输出</span>
                </div>
                <label class="settings-switch" aria-label="开关终端日志转发">
                    <input id="forward-renderer-console" type="checkbox" checked>
                    <span class="settings-switch-track" aria-hidden="true"></span>
                </label>
            </div>
            <p class="settings-note">更多界面和检索选项将在这里集中管理。</p>
        </div>
    </aside>

    <div class="app-layout">
    <main class="image-browser">

    <section id="local-section" class="browser-section active" data-page-section>
    <p>请选择扫描文件夹路径：<span id="file-path" class="url-style"></span></p>
    
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="path-controls">
                <button id="select-folder" class="toolbar-btn">
                    <span class="icon">📁</span> 选择文件夹
                </button>
                <button id="clear-path" class="toolbar-btn" title="清空当前路径">
                    <span class="icon">✖</span>
                </button>
            </div>
            
            <div class="action-buttons">
                <button id="start-search" class="toolbar-btn primary">
                    <span class="icon">🔍</span> 开始搜索
                </button>
                <button id="refresh-pic" class="toolbar-btn">
                    <span class="icon">🔄</span> 刷新
                </button>
                <button id="check-cache" class="toolbar-btn">
                    <span class="icon">🗃️</span> 缓存
                </button>
            </div>
        </div>
        
        <div class="toolbar-right">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="请输入图片名称以搜索...">
                <button id="search-button" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </div>
        </div>
	</div>
	</section>

	<section id="rir-section" class="browser-section" data-page-section>
	<p>当前RIR图片解析路径：<span id="rir-file-path" class="url-style">暂未获取到RIR解析路径...</span></p>
	<div class="toolbar" >
		<div class="toolbar-left">
			<div class="search-box">
				<input type="text" id="rir-parse-input" placeholder="请输入RIR文件地址...">
				<button id="rir-parse-button" class="search-btn">
					<span class="icon">🔍</span>
				</button>
			</div>
			<button id="rir-refresh-pic" class="toolbar-btn">
				<span class="icon">🔄</span> 刷新
			</button>
		</div>
		<div class="toolbar-right">
            <div class="search-box">
                <input type="text" id="rir-search-input" placeholder="请输入图片名称以搜索...">
                <button id="rir-search-button" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </div>
        </div>
		
	</div>
	</section>

        </form>
    </aside>
