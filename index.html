<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>图片检索工具</title>
    <style>
        /* 工具栏样式 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .toolbar-btn.primary {
            background-color: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .toolbar-btn.primary:hover {
            background-color: #3367d6;
        }

        .icon {
            margin-right: 6px;
            font-size: 15px;
        }

        .path-controls {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .path-controls button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }

        .path-controls button:last-child {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            padding: 8px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
        }

        #search-input,#rir-search-input,#rir-parse-input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            width: 200px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-left: none;
            border-radius: 0 6px 6px 0;
            background-color: #f8f8f8;
            cursor: pointer;
        }

        .search-btn:hover {
            background-color: #eee;
        }

        #file-path {
        }
		.url-style {
            font-weight: bold;
            color: #4285f4;
            margin-left: 5px;
		}

        /* 图片展示区域 - 修复高度问题 */
        .image-container {
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .grid-img {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 确保4列 */
            grid-auto-rows: 1fr; /* 所有行等高 */
            gap: 15px;
            /* padding: 10px 0; */
        }

        .img-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            aspect-ratio: 1/1; /* 保持正方形 */
            background-color: #f8f8f8;
            display: flex; /* 新增 */
            flex-direction: column; /* 新增 */
			border: 1px solid #ddd; /* 新增 - 边框 */
        }

        .img-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            flex-grow: 1; /* 新增 - 确保图片填充空间 */
        }

        /* 操作按钮 */
        .copy-btn, .rename-btn {
            position: absolute;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.9);
            color: #333;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }

        .copy-btn {
            top: 8px;
            right: 8px;
        }

        .rename-btn {
            top: 8px;
            left: 8px;
        }

        .img-item:hover .copy-btn,
        .img-item:hover .rename-btn {
            opacity: 1;
        }

        .copy-btn:hover, .rename-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .pagination-info {
            font-size: 14px;
            color: #555;
        }

        body {
            margin: 10px;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            color: #1f2937;
            background: #f7f8fa;
        }

        .app-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 350px;
            gap: 14px;
            align-items: start;
        }

        .image-browser {
            min-width: 0;
        }

        .ai-panel {
            position: sticky;
            top: 10px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 20px);
            min-height: 620px;
            overflow: hidden;
            border: 1px solid #dde3ec;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(36, 55, 88, 0.12);
        }

        .ai-panel-header {
            padding: 14px 16px 12px;
            color: #fff;
            background: linear-gradient(135deg, #245eea, #7048e8);
        }

        .ai-panel-header h2 {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .ai-status {
            min-height: 18px;
            margin: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.84);
        }

        .ai-messages {
            flex: 1;
            min-height: 140px;
            overflow-y: auto;
            padding: 14px;
            background: #f7f8fc;
        }

        .ai-message {
            width: fit-content;
            max-width: 88%;
            margin-bottom: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-message.assistant {
            border: 1px solid #e2e6ee;
            border-bottom-left-radius: 3px;
            background: #fff;
        }

        .ai-message.user {
            margin-left: auto;
            border-bottom-right-radius: 3px;
            color: #fff;
            background: #3569df;
        }

        .ai-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 14px 10px;
            background: #f7f8fc;
        }

        .ai-suggestion {
            padding: 5px 8px;
            border: 1px solid #ccd7f7;
            border-radius: 999px;
            color: #3159b8;
            background: #eef3ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-results-section {
            max-height: 245px;
            overflow-y: auto;
            padding: 10px 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-results-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #687187;
        }

        .ai-results {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ai-result-card {
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid #e0e5ee;
            border-radius: 7px;
            background: #fff;
            cursor: pointer;
        }

        .ai-result-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .ai-result-card span {
            display: block;
            padding: 4px;
            overflow: hidden;
            font-size: 9px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ai-show-gallery {
            padding: 3px 7px;
            border: 1px solid #c7d4f9;
            border-radius: 5px;
            color: #3159b8;
            background: #f2f5ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-composer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-composer textarea {
            min-height: 44px;
            max-height: 110px;
            padding: 8px 9px;
            resize: vertical;
            border: 1px solid #ccd2dd;
            border-radius: 7px;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        .ai-composer textarea:focus {
            border-color: #4773df;
            box-shadow: 0 0 0 2px rgba(71, 115, 223, 0.13);
        }

        .ai-send {
            align-self: end;
            height: 38px;
            padding: 0 13px;
            border: none;
            border-radius: 7px;
            color: #fff;
            background: #3569df;
            cursor: pointer;
        }

        .ai-send:disabled {
            opacity: 0.55;
            cursor: wait;
        }
    </style>
</head>
<body>
    <link rel="stylesheet" href="node_modules/notyf/notyf.min.css">

    <div class="app-layout">
    <main class="image-browser">

    <p>请选择扫描文件夹路径：<span id="file-path" class="url-style"></span></p>
    
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="path-controls">
                <button id="select-folder" class="toolbar-btn">
                    <span class="icon">📁</span> 选择文件夹
                </button>
                <button id="clear-path" class="toolbar-btn" title="清空当前路径">
                    <span class="icon">✖</span>
                </button>
            </div>
            
            <div class="action-buttons">
                <button id="start-search" class="toolbar-btn primary">
                    <span class="icon">🔍</span> 开始搜索
                </button>
                <button id="refresh-pic" class="toolbar-btn">
                    <span class="icon">🔄</span> 刷新
                </button>
                <button id="check-cache" class="toolbar-btn">
                    <span class="icon">🗃️</span> 缓存
                </button>
            </div>
        </div>
        
        <div class="toolbar-right">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="请输入图片名称以搜索...">
                <button id="search-button" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </div>
        </div>
    </div>
	<p>当前RIR图片解析路径：<span id="rir-file-path" class="url-style">暂未获取到RIR解析路径...</span></p>
	<div class="toolbar" >
		<div class="toolbar-left">
			<div class="search-box">
				<input type="text" id="rir-parse-input" placeholder="请输入RIR文件地址...">
				<button id="rir-parse-button" class="search-btn">
					<span class="icon">🔍</span>
				</button>
			</div>
			<button id="rir-refresh-pic" class="toolbar-btn">
				<span class="icon">🔄</span> 刷新
			</button>
		</div>
		<div class="toolbar-right">
            <div class="search-box">
                <input type="text" id="rir-search-input" placeholder="请输入图片名称以搜索...">
                <button id="rir-search-button" class="search-btn">
                    <span class="icon">🔍</span>
                </button>
            </div>
        </div>
		
	</div>
    <!-- 图片展示区域 -->
    <div class="image-container">
        <div class="grid-img">
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
            <div class="img-item">
                <img src="./public/img/404.png" alt="图片丢失了">
                <button class="copy-btn">复制</button>
                <button class="rename-btn">改标签</button>
            </div>
        </div>

        <!-- 分页控件 -->
        <div class="pagination">
            <button id="forward">&lt; 上一页</button>
            <span class="pagination-info">第 <span id="page-num">1</span> / <span id="all-page-num">1</span>  页</span>
            <button id="backward">下一页 &gt;</button>
        </div>
    </div>

    </main>
    <aside class="ai-panel" aria-label="AI 图片问答">
        <header class="ai-panel-header">
            <h2>AI 图片助手</h2>
            <p id="ai-status" class="ai-status">Milvus · LangGraph · DeepSeek</p>
        </header>
        <div id="ai-messages" class="ai-messages" aria-live="polite">
            <div class="ai-message assistant">告诉我你想找什么图片。例如：“找 8 张透明背景的咖波表情包”。</div>
        </div>
        <div class="ai-suggestions">
            <button class="ai-suggestion" data-prompt="找 8 张可爱的咖波表情包">咖波表情</button>
            <button class="ai-suggestion" data-prompt="帮我找透明背景的卡通素材">透明素材</button>
            <button class="ai-suggestion" data-prompt="找一些高雅人士企鹅图片">企鹅素材</button>
        </div>
        <section class="ai-results-section">
            <div class="ai-results-heading">
                <span id="ai-results-count">检索结果</span>
                <button id="ai-show-gallery" class="ai-show-gallery" type="button" disabled>在主图区查看</button>
            </div>
            <div id="ai-results" class="ai-results"></div>
        </section>
        <form id="ai-form" class="ai-composer">
            <textarea id="ai-input" maxlength="2000" placeholder="描述想找的图片…" aria-label="AI 问题"></textarea>
            <button id="ai-send" class="ai-send" type="submit">发送</button>
        </form>
    </aside>
    </div>

    <script src="./dist/dom.js"></script>
    <script src="./dist/ai-chat.js"></script>
</body>
</html>
