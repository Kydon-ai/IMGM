<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./public/img/IMGM.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.qidong.tech:5173; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:; connect-src 'self' https:; font-src 'self' data:;" />
    <title>图片检索工具</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* 工具栏样式 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .toolbar-btn.primary {
            background-color: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .toolbar-btn.primary:hover {
            background-color: #3367d6;
        }

        .icon {
            margin-right: 6px;
            font-size: 15px;
        }

        .path-controls {
            display: flex;
            align-items: center;
            background-color: white;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .path-controls button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }

        .path-controls button:last-child {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            padding: 8px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
        }

        #search-input,#rir-search-input,#rir-parse-input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px 0 0 6px;
            width: 200px;
            font-size: 14px;
            outline: none;
        }

        .search-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-left: none;
            border-radius: 0 6px 6px 0;
            background-color: #f8f8f8;
            cursor: pointer;
        }

        .search-btn:hover {
            background-color: #eee;
        }

        #file-path {
        }
        .url-style {
            font-weight: bold;
            color: #4285f4;
            margin-left: 5px;
		}

        .local-path-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 28px;
        }

        .local-path-row > p {
            min-width: 0;
            margin: 8px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-history-controls {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 5px;
        }

        .search-history-button {
            display: grid;
            place-items: center;
            width: 29px;
            height: 27px;
            padding: 0;
            border: 1px solid #dce5f3;
            border-radius: 7px;
            color: #5b7cfa;
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .search-history-button:hover:not(:disabled) {
            border-color: #aebef8;
            background: #eef3ff;
        }

        .search-history-button:disabled {
            color: #b9c3d2;
            background: #f5f7fa;
            cursor: not-allowed;
        }

        /* 图片展示区域 - 修复高度问题 */
        .image-container {
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .grid-img {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 确保4列 */
            grid-auto-rows: 1fr; /* 所有行等高 */
            gap: 15px;
            /* padding: 10px 0; */
        }

        .img-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            aspect-ratio: 1/1; /* 保持正方形 */
            background-color: #f8f8f8;
            display: flex; /* 新增 */
            flex-direction: column; /* 新增 */
			border: 1px solid #ddd; /* 新增 - 边框 */
        }

        .img-item[hidden] {
            display: none !important;
        }

        .img-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            flex-grow: 1; /* 新增 - 确保图片填充空间 */
        }

        /* 操作按钮 */
        .copy-btn {
            position: absolute;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.9);
            color: #333;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }

        .copy-btn {
            top: 8px;
            right: 8px;
        }

        .img-item:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }

        /* 分页控件 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background-color: #f0f0f0;
            border-color: #ccc;
        }

        .pagination-info {
            font-size: 14px;
            color: #555;
        }

        body {
            margin: 0;
            min-width: 1220px;
            min-height: 0;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            color: #1f2937;
            background: #eef3f8;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
            gap: 14px;
            padding: 10px;
            overflow: hidden;
        }

        /* imgm 风格的窄侧栏：保持固定宽度，让主工作区拥有更多空间。 */
        .imgm-sidebar {
            position: relative;
            z-index: 10;
            display: flex;
            flex: 0 0 72px;
            flex-direction: column;
            align-items: center;
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
            padding: 15px 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 17px;
            background: linear-gradient(180deg, #176bd1 0%, #2451b8 55%, #332f93 100%);
            box-shadow: 0 12px 30px rgba(29, 73, 146, 0.22);
            color: #fff;
        }

        .imgm-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            width: 100%;
        }

        .imgm-avatar {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 3px;
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 14px rgba(10, 44, 115, 0.24);
        }

        .imgm-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .imgm-profile-name {
            max-width: 58px;
            overflow: hidden;
            color: rgba(255, 255, 255, 0.92);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .imgm-nav {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            /* margin-top: 22px; */
        }

        .imgm-nav-item,
        .imgm-settings-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 54px;
            min-height: 58px;
            padding: 6px 3px;
            border: 0;
            border-radius: 13px;
            color: rgba(255, 255, 255, 0.76);
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .imgm-nav-item:hover,
        .imgm-settings-button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        .imgm-nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.19);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 6px 14px rgba(12, 43, 111, 0.16);
        }

        .imgm-nav-icon {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            margin-bottom: 4px;
            border-radius: 10px;
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            font-size: 18px;
            line-height: 1;
        }

        .imgm-nav-label {
            font-size: 11px;
            line-height: 1;
            white-space: nowrap;
        }

        .imgm-sidebar-divider {
            width: 42px;
            height: 1px;
            margin: 8px 0 10px;
            background: rgba(255, 255, 255, 0.18);
        }

        .imgm-settings-button {
            min-height: 54px;
        }

        .settings-popover {
            position: absolute;
            bottom: 12px;
            left: 84px;
            width: 238px;
            padding: 14px;
            border: 1px solid #dce5f5;
            border-radius: 13px;
            color: #25324a;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 14px 35px rgba(28, 47, 85, 0.2);
        }

        .settings-popover[hidden] {
            display: none;
        }

        .settings-popover-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .settings-close {
            width: 25px;
            height: 25px;
            border: 0;
            border-radius: 7px;
            color: #63708b;
            background: #f0f4fa;
            cursor: pointer;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-top: 1px solid #edf1f7;
            font-size: 12px;
        }

        .settings-row strong {
            max-width: 145px;
            overflow: hidden;
            color: #4b6dcc;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .settings-toggle-copy {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 3px;
        }

        .settings-toggle-title {
            color: #25324a;
            font-weight: 600;
        }

        .settings-toggle-description {
            color: #8590a6;
            font-size: 10px;
        }

        .settings-switch {
            position: relative;
            display: inline-flex;
            flex: 0 0 auto;
            width: 38px;
            height: 22px;
            cursor: pointer;
        }

        .settings-switch input {
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .settings-switch-track {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #cbd4e4;
            transition: background 0.2s ease;
        }

        .settings-switch-track::after {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(31, 47, 78, 0.25);
            content: "";
            transition: transform 0.2s ease;
        }

        .settings-switch input:checked + .settings-switch-track {
            background: #4b6dcc;
        }

        .settings-switch input:checked + .settings-switch-track::after {
            transform: translateX(16px);
        }

        .settings-switch input:focus-visible + .settings-switch-track {
            outline: 2px solid #91aaf2;
            outline-offset: 2px;
        }

        .settings-note {
            margin: 10px 0 0;
            color: #8590a6;
            font-size: 11px;
            line-height: 1.5;
        }

        .app-layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(750px, 1fr) 350px;
            grid-template-rows: minmax(0, 1fr);
            gap: 14px;
            align-items: stretch;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .browser-section {
            scroll-margin-top: 18px;
        }

        .browser-section[data-page-section] {
            display: none;
        }

        .browser-section[data-page-section].active {
            display: block;
        }

        .app-shell.rir-mode .ai-panel {
            display: none;
        }

        .app-shell.rir-mode .app-layout {
            grid-template-columns: minmax(750px, 1fr);
        }

        /* RIR 没有右侧 AI 面板，使用更紧凑的两行网格，避免主区域纵向溢出。 */
        .app-shell.rir-mode .grid-img {
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 14px;
        }

        .app-shell.rir-mode .img-item {
            aspect-ratio: 1 / 0.78;
        }

        /* 让图片区域占用工具栏和分页器之外的剩余高度。 */
        .image-browser {
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .browser-section[data-page-section].active {
            display: block;
            flex: 0 0 auto;
        }

        .image-container {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
        }

        .grid-img {
            flex: 1 1 auto;
            min-height: 0;
        }

        .pagination {
            flex: 0 0 auto;
        }

        /* RIR 一页保持两行，卡片高度由容器剩余空间决定。 */
        .app-shell.rir-mode .image-browser {
            overflow-y: hidden;
        }

        .app-shell.rir-mode .image-container {
            min-height: 0;
            margin-bottom: 0;
            overflow: hidden;
        }

        .app-shell.rir-mode .grid-img {
            grid-template-rows: repeat(2, minmax(0, 1fr));
        }

        .app-shell.rir-mode .img-item {
            min-height: 0;
            height: 100%;
            aspect-ratio: auto;
        }

        .image-browser {
            min-width: 750px;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .ai-panel {
            position: sticky;
            top: 10px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            border: 1px solid #dde3ec;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(36, 55, 88, 0.12);
        }

        .ai-panel-header {
            padding: 14px 16px 12px;
            color: #fff;
            background: linear-gradient(135deg, #245eea, #7048e8);
        }

        .ai-panel-header h2 {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .ai-status {
            min-height: 18px;
            margin: 0;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.84);
        }

        .ai-messages {
            flex: 1;
            min-height: 140px;
            overflow-y: auto;
            padding: 14px;
            background: #f7f8fc;
        }

        .ai-message {
            width: fit-content;
            max-width: 88%;
            margin-bottom: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-message.assistant {
            border: 1px solid #e2e6ee;
            border-bottom-left-radius: 3px;
            background: #fff;
        }

        .ai-message.user {
            margin-left: auto;
            border-bottom-right-radius: 3px;
            color: #fff;
            background: #3569df;
        }

        .ai-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 14px 10px;
            background: #f7f8fc;
        }

        .ai-suggestion {
            padding: 5px 8px;
            border: 1px solid #ccd7f7;
            border-radius: 999px;
            color: #3159b8;
            background: #eef3ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-results-section {
            max-height: 245px;
            overflow-y: auto;
            padding: 10px 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-results-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: #687187;
        }

        .ai-results {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ai-result-card {
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid #e0e5ee;
            border-radius: 7px;
            background: #fff;
            cursor: pointer;
        }

        .ai-result-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .ai-result-card span {
            display: block;
            padding: 4px;
            overflow: hidden;
            font-size: 9px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ai-show-gallery {
            padding: 3px 7px;
            border: 1px solid #c7d4f9;
            border-radius: 5px;
            color: #3159b8;
            background: #f2f5ff;
            cursor: pointer;
            font-size: 11px;
        }

        .ai-composer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e8ebf1;
        }

        .ai-composer textarea {
            min-height: 44px;
            max-height: 110px;
            padding: 8px 9px;
            resize: vertical;
            border: 1px solid #ccd2dd;
            border-radius: 7px;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        .ai-composer textarea:focus {
            border-color: #4773df;
            box-shadow: 0 0 0 2px rgba(71, 115, 223, 0.13);
        }

        .ai-send {
            align-self: end;
            height: 38px;
            padding: 0 13px;
            border: none;
            border-radius: 7px;
            color: #fff;
            background: #3569df;
            cursor: pointer;
        }

        .ai-send:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        /* 视觉主题：柔和蓝色、轻灰蓝背景和更清晰的层级。 */
        :root {
            --imgm-blue: #5b7cfa;
            --imgm-blue-dark: #4664d8;
            --imgm-blue-soft: #eef2ff;
            --imgm-bg: #f5f7fa;
            --imgm-border: #e1e7f0;
            --imgm-text: #25324a;
            --imgm-muted: #78869f;
        }

        body {
            color: var(--imgm-text);
            background: var(--imgm-bg);
        }

        .app-shell {
            gap: 16px;
            padding: 16px;
        }

        .imgm-sidebar {
            flex-basis: 78px;
            padding: 17px 10px 13px;
            border-color: rgba(255, 255, 255, 0.45);
            border-radius: 18px;
            background: linear-gradient(180deg, #5b7cfa 0%, #536cd8 58%, #4c5bbd 100%);
            box-shadow: 0 10px 28px rgba(70, 94, 180, 0.2);
        }

        .imgm-nav {
            gap: 10px;
            margin-top: 8px;
        }

        .imgm-nav-item,
        .imgm-settings-button {
            width: 58px;
            min-height: 61px;
            border-radius: 14px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .imgm-nav-item:hover,
        .imgm-settings-button:hover {
            background: rgba(238, 242, 255, 0.2);
            box-shadow: 0 5px 14px rgba(38, 59, 143, 0.12);
        }

        .imgm-nav-item.active {
            color: #3855c5;
            background: #eaf0ff;
            box-shadow: 0 7px 16px rgba(32, 53, 137, 0.18);
        }

        .imgm-nav-item.active .imgm-nav-icon {
            color: var(--imgm-blue-dark);
            background: #d7e1ff;
        }

        .imgm-nav-icon {
            background: rgba(255, 255, 255, 0.17);
        }

        .toolbar {
            gap: 16px;
            padding: 11px 13px;
            border: 1px solid var(--imgm-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.86);
            box-shadow: 0 2px 8px rgba(39, 58, 93, 0.06);
        }

        .toolbar-left,
        .toolbar-right {
            gap: 9px;
        }

        .toolbar-btn {
            min-height: 36px;
            padding: 8px 12px;
            border-color: #dce3ef;
            border-radius: 9px;
            color: #47556e;
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .toolbar-btn:hover {
            border-color: #c8d3e8;
            color: var(--imgm-blue-dark);
            background: #f8faff;
            box-shadow: 0 3px 8px rgba(45, 73, 142, 0.08);
            transform: translateY(-1px);
        }

        .toolbar-btn.primary {
            border-color: var(--imgm-blue);
            color: #fff;
            background: var(--imgm-blue);
            box-shadow: 0 5px 12px rgba(91, 124, 250, 0.22);
        }

        .toolbar-btn.primary:hover {
            border-color: var(--imgm-blue-dark);

        .embedding-index-group-header { display: flex; align-items: center; min-height: 44px; padding: 0 12px; gap: 10px; }
        .embedding-index-group-toggle {
            display: flex;
            flex: 1;
            align-items: center;
            min-width: 0;

            border: 0;
            color: #31415c;
            background: transparent;

        .embedding-index-items { border-top: 1px solid #edf1f7; }
        .embedding-index-item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) 54px;
            align-items: center;
            min-height: 62px;
            padding: 7px 13px;
            gap: 12px;
            border-bottom: 1px solid #f0f3f7;

        .embedding-index-file-name { overflow: hidden; color: #374151; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
        .embedding-index-preview { width: 52px; height: 46px; border-radius: 6px; background: #eef2f7; object-fit: cover; }

        .embedding-index-footer { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #e6ebf3; }
        .embedding-index-footer button { min-width: 76px; }
        .embedding-index-apply { border-color: #5b7cfa; color: #fff; background: #5b7cfa; }
        .embedding-index-apply:hover:not(:disabled) { background: #4269ef; }

        .embedding-index-progress {
            position: fixed;
            z-index: 900;
            right: 22px;
            bottom: 22px;
            width: min(360px, calc(100vw - 44px));
            padding: 14px;
            border: 1px solid #dce5f3;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(38, 59, 97, 0.16);
        }
        .embedding-index-progress[hidden] { display: none; }
        .embedding-index-progress-title { display: block; margin-bottom: 9px; color: #334155; font-size: 13px; font-weight: 600; }
        .embedding-index-progress progress { width: 100%; height: 7px; accent-color: #5b7cfa; }
        .embedding-index-progress-file { display: block; overflow: hidden; margin-top: 8px; color: #75839a; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
        .embedding-index-progress.is-error { border-color: #f3b4b4; }
        .embedding-index-progress-close { display: none; float: right; margin: -4px -3px 0 10px; padding: 2px 7px; border: 1px solid #dbe3ef; border-radius: 6px; color: #60708a; background: #fff; cursor: pointer; }
        .embedding-index-progress.is-complete .embedding-index-progress-close { display: block; }
        .embedding-index-progress-close:hover { color: #4269ef; border-color: #aebef8; background: #f4f7ff; }

            <span class="pagination-info">第 <span id="page-num" class="page-current">1</span> / <span id="all-page-num">1</span> 页</span>
            <button id="backward">下一页 &gt;</button>
        </div>
    </div>

    </main>
    <aside class="ai-panel" id="ai-panel" aria-label="AI 图片问答">
        <header class="ai-panel-header">
            <div class="ai-header-top">
                <div class="ai-title-wrap">
                    <span class="ai-brand-icon" aria-hidden="true">▣</span>
                    <h2>AI图片助手</h2>
                </div>
                <span class="ai-online">在线</span>
            </div>
            <p id="ai-status" class="ai-status">AI 已就绪</p>
        </header>
        <div id="ai-messages" class="ai-messages" aria-live="polite">
            <div class="ai-message assistant">告诉我你想找什么图片。例如：“找 8 张透明背景的咖波表情包”。</div>
        </div>
        <!-- <div class="ai-suggestions">
            <button class="ai-suggestion" data-prompt="找 8 张可爱的咖波表情包">咖波表情</button>
            <button class="ai-suggestion" data-prompt="帮我找透明背景的卡通素材">透明素材</button>
            <button class="ai-suggestion" data-prompt="找一些高雅人士企鹅图片">企鹅素材</button>
        </div> -->
        <form id="ai-form" class="ai-composer">
            <section id="ai-results-section" class="ai-results-section">
                <div class="ai-results-heading">
                    <span id="ai-results-count">检索结果</span>
                    <div class="ai-results-heading-actions">
                        <button id="ai-show-gallery" class="ai-show-gallery" type="button" disabled>在主图区查看</button>
                        <button id="ai-results-close" class="ai-results-close" type="button" aria-label="关闭检索结果">×</button>
                    </div>
                </div>
                <div id="ai-results" class="ai-results"></div>
            </section>
            <textarea id="ai-input" maxlength="2000" placeholder="描述想找的图片…" aria-label="AI 问题"></textarea>
            <button id="ai-send" class="ai-send" type="submit">发送</button>
        </form>
    </aside>
    </div>
    </div>

    <div id="embedding-index-dialog" class="embedding-index-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="embedding-index-title">
        <section class="embedding-index-panel">
            <header class="embedding-index-header">
                <h2 id="embedding-index-title">图片索引管理</h2>
                <p id="embedding-index-path"></p>
                <p id="embedding-index-summary" class="embedding-index-summary"></p>
            </header>
            <div id="embedding-index-groups" class="embedding-index-groups"></div>
            <footer class="embedding-index-footer">
                <button id="embedding-index-cancel" class="toolbar-btn ghost" type="button">取消</button>
                <button id="embedding-index-apply" class="toolbar-btn embedding-index-apply" type="button">应用</button>
            </footer>
        </section>
    </div>

    <section id="embedding-index-progress" class="embedding-index-progress" hidden aria-live="polite">
        <button id="embedding-index-progress-close" class="embedding-index-progress-close" type="button">关闭</button>
        <span id="embedding-index-progress-title" class="embedding-index-progress-title">图片索引任务已提交</span>
        <progress id="embedding-index-progress-bar" value="0" max="100"></progress>
        <span id="embedding-index-progress-file" class="embedding-index-progress-file"></span>
    </section>

    <script src="./dist/dom.js"></script>
    <script src="./dist/ai-chat.js"></script>
</body>
</html>
