name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund

      - name: Rebuild native modules for Electron
        shell: pwsh
        run: |
          $electronVersion = node -p "require('./node_modules/electron/package.json').version"
          npx --no-install electron-rebuild --force --which-module better-sqlite3 --version $electronVersion

      - name: Build and test
        run: npm test
